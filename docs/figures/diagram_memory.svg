<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 268" width="760" height="268" role="img" aria-label="Memory one request needs, against context length: the KV cache of the 8 attention layers grows to 8 GiB in BF16 or 4 GiB in FP8 at 262k tokens, while the DeltaNet state stays at 48 MiB in FP32. With attention in all 32 layers the cache would reach 32 GiB.">
<title>Memory one request needs, against context length: the KV cache of the 8 attention layers grows to 8 GiB in BF16 or 4 GiB in FP8 at 262k tokens, while the DeltaNet state stays at 48 MiB in FP32. With attention in all 32 layers the cache would reach 32 GiB.</title>
<style>
  svg { --surface: #ffffff; --fg: #1b2a3a; --muted: #5b6472; --line: #e4e8ee; --edge: #b6bec9;
        --ref: #8a93a3; --accent: #2b4c7e; --accent-soft: #e9eef6; --s2: #d0675a;
        color: var(--fg); font-family: "IBM Plex Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  .bg { fill: var(--surface); }
  .svg-accent { fill: var(--accent); } .svg-accent-soft { fill: var(--accent-soft); }
  .svg-surface { fill: var(--surface); } .svg-muted { fill: var(--muted); } .svg-s2 { fill: var(--s2); }
  .mono { font-family: "IBM Plex Mono", SFMono-Regular, Menlo, Consolas, monospace; }
  rect[stroke="currentColor"] { stroke: var(--edge); }
  line[stroke="currentColor"], path[stroke="currentColor"] { stroke: var(--ref); }
  marker path { fill: var(--ref); }
  .anim { transform-box: view-box; transform-origin: 0 0; }
  @media (prefers-reduced-motion: reduce) { .anim { animation: none !important; } }
</style>
<rect class="bg" x="0" y="0" width="760" height="268" rx="10"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<line x1="70" y1="196.0" x2="570" y2="196.0" stroke="#e4e8ee"/>
<text x="62" y="200.0" text-anchor="end" font-size="10.5" class="svg-muted mono">0</text>
<line x1="70" y1="160.44444444444446" x2="570" y2="160.44444444444446" stroke="#e4e8ee"/>
<text x="62" y="164.44444444444446" text-anchor="end" font-size="10.5" class="svg-muted mono">2</text>
<line x1="70" y1="124.88888888888889" x2="570" y2="124.88888888888889" stroke="#e4e8ee"/>
<text x="62" y="128.88888888888889" text-anchor="end" font-size="10.5" class="svg-muted mono">4</text>
<line x1="70" y1="89.33333333333334" x2="570" y2="89.33333333333334" stroke="#e4e8ee"/>
<text x="62" y="93.33333333333334" text-anchor="end" font-size="10.5" class="svg-muted mono">6</text>
<line x1="70" y1="53.77777777777777" x2="570" y2="53.77777777777777" stroke="#e4e8ee"/>
<text x="62" y="57.77777777777777" text-anchor="end" font-size="10.5" class="svg-muted mono">8</text>
<text x="195.0" y="212" text-anchor="middle" font-size="10.5" class="svg-muted mono">64k</text>
<text x="320.0" y="212" text-anchor="middle" font-size="10.5" class="svg-muted mono">128k</text>
<text x="445.0" y="212" text-anchor="middle" font-size="10.5" class="svg-muted mono">192k</text>
<text x="570.0" y="212" text-anchor="middle" font-size="10.5" class="svg-muted mono">262k</text>
<text x="320.0" y="230" text-anchor="middle" font-size="11" class="svg-muted">tokens of context in one request</text>
<text x="16" y="22" font-size="11" class="svg-muted">GiB per request</text>
<line x1="70.0" y1="196.0" x2="570.0" y2="53.77777777777777" stroke="#a3abb8" stroke-width="2.4"/>
<text x="578.0" y="57.77777777777777" font-size="11.5" font-weight="600" fill="currentColor">KV cache, BF16: 8 GiB</text>
<line x1="70.0" y1="196.0" x2="570.0" y2="124.88888888888889" stroke="#7d93b8" stroke-width="2.4"/>
<text x="578.0" y="128.88888888888889" font-size="11.5" font-weight="600" fill="currentColor">KV cache, FP8: 4 GiB</text>
<line x1="70.0" y1="195.16666666666666" x2="570.0" y2="195.16666666666666" stroke="#1b2a3a" stroke-width="2.4"/>
<text x="578.0" y="177.16666666666666" font-size="11.5" font-weight="600" fill="currentColor">one DeltaNet state:</text>
<text x="578.0" y="191.16666666666666" font-size="11.5" fill="currentColor">48 MiB in FP32, flat</text>
<line x1="70.0" y1="196.0" x2="210.625" y2="36.0" stroke="#8a93a3" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="218.625" y="48.0" font-size="11" class="svg-muted">if all 32 layers were attention (BF16): 32 GiB at 262k</text>
<text x="16" y="254" font-size="11" class="svg-muted">What one request needs, computed from the model's config.json, before the engines' own reservations.</text>
</svg>
