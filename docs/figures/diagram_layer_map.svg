<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 214" width="760" height="214" role="img" aria-label="The NVFP4 checkpoint layer by layer: every fourth of the 32 layers uses attention and the rest Gated DeltaNet. All attention and DeltaNet weights are FP8, the MLPs of layers 0 to 27 are NVFP4 and the last four FP8. The 8 attention layers keep a KV cache that grows with the context, while the 24 DeltaNet layers keep a fixed 48 MiB FP32 state.">
<title>The NVFP4 checkpoint layer by layer: every fourth of the 32 layers uses attention and the rest Gated DeltaNet. All attention and DeltaNet weights are FP8, the MLPs of layers 0 to 27 are NVFP4 and the last four FP8. The 8 attention layers keep a KV cache that grows with the context, while the 24 DeltaNet layers keep a fixed 48 MiB FP32 state.</title>
