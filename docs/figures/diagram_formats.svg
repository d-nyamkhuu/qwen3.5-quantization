<text x="210.0" y="192" font-size="12" font-weight="600" fill="currentColor" class="mono">4.5 bits · 156 tokens/s</text>
<text x="210.0" y="207" font-size="11" class="svg-muted">4-bit floats, one FP8 scale per group of 16 · math in FP4 on Blackwell tensor cores</text>
<text x="92" y="238" font-size="11" class="svg-muted">One square = one bit per weight. The pale sliver is the scale shared by a group of weights.</text>
<text x="92" y="254" font-size="11" class="svg-muted">Each new token reads every weight once. Tokens/s is one request's measured speed on vLLM.</text>
