<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" width="760" height="336" role="img" aria-label="Choosing a format: for one or a few requests at a time, W4A16. For many requests, NVFP4 on a Blackwell GPU, FP8 on Ada or Hopper, and W4A16 on older GPUs.">
<title>Choosing a format: for one or a few requests at a time, W4A16. For many requests, NVFP4 on a Blackwell GPU, FP8 on Ada or Hopper, and W4A16 on older GPUs.</title>
<style>
  svg { --surface: #ffffff; --fg: #1b2a3a; --muted: #5b6472; --line: #e4e8ee; --edge: #b6bec9;
        --ref: #8a93a3; --accent: #2b4c7e; --accent-soft: #e9eef6; --s2: #d0675a;
        color: var(--fg); font-family: "IBM Plex Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  .bg { fill: var(--surface); }
  .svg-accent { fill: var(--accent); } .svg-accent-soft { fill: var(--accent-soft); }
  .svg-surface { fill: var(--surface); } .svg-muted { fill: var(--muted); } .svg-s2 { fill: var(--s2); }
  .mono { font-family: "IBM Plex Mono", SFMono-Regular, Menlo, Consolas, monospace; }
  rect[stroke="currentColor"] { stroke: var(--edge); }
  line[stroke="currentColor"], path[stroke="currentColor"] { stroke: var(--ref); }
  marker path { fill: var(--ref); }
  .anim { transform-box: view-box; transform-origin: 0 0; }
  @media (prefers-reduced-motion: reduce) { .anim { animation: none !important; } }
</style>
<rect class="bg" x="0" y="0" width="760" height="336" rx="10"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<g text-anchor="middle" font-size="12">
<rect x="270" y="14" width="280" height="58" rx="29" class="svg-surface" stroke="currentColor"/>
<text x="410.0" y="39" font-weight="600" fill="currentColor">Mostly one or a few requests at a time?</text>
<text x="410.0" y="56" font-size="11" class="svg-muted">chat, agents, local use</text>
<rect x="16" y="124" width="200" height="72" rx="8" fill="#d0675a"/>
<text x="116" y="151" font-weight="700" font-size="16" fill="#ffffff">W4A16</text>
<text x="116" y="170" font-size="11" fill="#ffffff">2.2× BF16 for a single user</text>
<text x="116" y="185" font-size="11" fill="#ffffff">runs on Turing and newer</text>
<rect x="330" y="124" width="260" height="58" rx="29" class="svg-surface" stroke="currentColor"/>
<text x="460.0" y="149" font-weight="600" fill="currentColor">Which GPU?</text>
<text x="460.0" y="166" font-size="11" class="svg-muted">FP8 math needs Ada+, FP4 math Blackwell</text>
<rect x="230" y="250" width="200" height="72" rx="8" fill="#2b4c7e"/>
<text x="330" y="277" font-weight="700" font-size="16" fill="#ffffff">NVFP4</text>
<text x="330" y="296" font-size="11" fill="#ffffff">1.58× peak throughput</text>
<text x="330" y="311" font-size="11" fill="#ffffff">37% lower cost per token</text>
<rect x="520" y="250" width="200" height="72" rx="8" fill="#7d93b8"/>
<text x="620" y="277" font-weight="700" font-size="16" fill="#ffffff">FP8</text>
<text x="620" y="296" font-size="11" fill="#ffffff">1.4× peak throughput</text>
<text x="620" y="311" font-size="11" fill="#ffffff">the safe default</text>
<line x1="320" y1="68" x2="150" y2="122" stroke="currentColor" marker-end="url(#ar)"/>
<text x="214" y="86" font-size="11" class="svg-muted">yes</text>
<line x1="460" y1="72" x2="460" y2="122" stroke="currentColor" marker-end="url(#ar)"/>
<text x="468" y="102" font-size="11" text-anchor="start" class="svg-muted">no, many</text>
<line x1="330" y1="153" x2="218" y2="153" stroke="currentColor" marker-end="url(#ar)"/>
<text x="274" y="146" font-size="11" class="svg-muted">older</text>
<text x="274" y="170" font-size="10.5" class="svg-muted">Turing, Ampere</text>
<line x1="410" y1="182" x2="340" y2="248" stroke="currentColor" marker-end="url(#ar)"/>
<text x="366" y="214" font-size="11" text-anchor="end" class="svg-muted">Blackwell</text>
<line x1="510" y1="182" x2="610" y2="248" stroke="currentColor" marker-end="url(#ar)"/>
<text x="572" y="210" font-size="11" text-anchor="start" class="svg-muted">Ada, Hopper</text>
</g>
</svg>
